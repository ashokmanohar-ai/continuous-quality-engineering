name: Security Quality

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1-5'

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - name: Software composition analysis
        run: npm audit --json > reports/raw/npm-audit.json || true
      - id: gitleaks
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: security/gitleaks/gitleaks.toml
      - if: steps.gitleaks.outcome == 'success'
        run: node --import tsx scripts/write-evidence.ts gitleaks
      - name: Build container
        if: always()
        run: docker build --tag acme-order-service:${{ github.sha }} .
      - name: Scan source and image
        if: always()
        run: |
          mkdir -p .trivy-cache reports/raw
          docker run --rm \
            --volume "$PWD:/workspace:ro" \
            --volume "$PWD/reports/raw:/reports" \
            --volume "$PWD/.trivy-cache:/root/.cache" \
            aquasec/trivy:0.68.2 \
            fs --format json --output /reports/trivy-fs.json /workspace
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$PWD/reports/raw:/reports" \
            --volume "$PWD/.trivy-cache:/root/.cache" \
            aquasec/trivy:0.68.2 \
            image --format json --output /reports/trivy.json acme-order-service:${{ github.sha }}
      - name: Start target for ZAP
        if: always()
        run: |
          docker run -d --name acme-zap-target -p 3000:3000 acme-order-service:${{ github.sha }}
          npm run wait:health
      - if: always()
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://127.0.0.1:3000
          rules_file_name: security/zap/zap-baseline.conf
          allow_issue_writing: false
          artifact_name: zap-report
      - name: Preserve ZAP JSON
        if: always()
        run: |
          if [ -f report_json.json ]; then cp report_json.json reports/raw/zap.json; fi
      - name: Enforce security thresholds
        if: always()
        run: npm run security:gate
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-evidence
          path: reports/raw
          retention-days: 30

  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
